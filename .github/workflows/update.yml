name: 更新基金會贊助資料

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 00:00（台灣時間 08:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests beautifulsoup4 openpyxl

      - name: 抓取最新資料
        run: python fetch_announcements.py

      - name: 有變更才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js index.html state.json notices_history.json
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "自動更新基金會贊助資料"
            git push
          fi
